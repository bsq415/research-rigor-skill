name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile bundled scripts
        run: python -m compileall -q skills/research-rigor/scripts install.py

      - name: Run lifecycle and fail-closed tests
        run: python -m unittest discover -s tests -v

      - name: Check Codex installation route
        run: python install.py --host codex --dry-run

      - name: Check Claude Code installation route
        run: python install.py --host claude-code --dry-run
